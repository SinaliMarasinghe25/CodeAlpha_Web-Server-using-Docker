version: '3.9'

services:
  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nginx-webserver
    ports:
      - "8080:80"
    restart: always
    volumes:
      - ./logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "project=codealpha-docker"
      - "task=task4-webserver"

networks:
  default:
    name: webserver-network